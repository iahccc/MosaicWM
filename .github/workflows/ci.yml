name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  shexli:
    name: Shexli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tree-sitter 0.26 breaks ABI with the 0.25 javascript grammar shexli ships, which segfaults the parser
      - run: pip install shexli "tree-sitter<0.26"
      - run: shexli ${{ github.workspace }}/extension/

  build:
    name: GNOME 50 build and regression
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y gcc pkgconf-pkg-config gobject-introspection-devel mutter-devel glib2-devel zip gnome-shell dbus-daemon mesa-dri-drivers alacritty
      - run: bash scripts/build.sh -b
      - run: bash scripts/test-headless.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: bash scripts/test-headless.sh test-miniature-restore.js
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: bash scripts/test-headless.sh test-maximized-admission-fit.js
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
