name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  shexli:
    name: Shexli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tree-sitter 0.26 breaks ABI with the 0.25 javascript grammar shexli ships, which segfaults the parser
      - run: pip install shexli "tree-sitter<0.26"
      - run: shexli ${{ github.workspace }}/extension/

  build:
    name: GNOME 50 build and regression
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # firefox is here for test-firefox-miniature.js, which declares it as required: this job
      # means to run every regression, so a missing binary must fail rather than be skipped.
      - run: dnf install -y gcc pkgconf-pkg-config gobject-introspection-devel mutter-devel glib2-devel zip gnome-shell dbus-daemon mesa-dri-drivers alacritty firefox
      - run: bash scripts/build.sh -b
      # "all" enumerates scripts/test-*.js, so a new regression cannot be added without a
      # runner. Naming three files here is what left test-constrained-model-slot,
      # test-solo-monitor-sized-admission, test-firefox-miniature, test-reinclude-local and
      # test-unmaximize-animation unreferenced.
      #
      # HEADLESS_REQUIRE_ALL turns a skipped regression into a failure: this job is the one
      # place that is supposed to cover everything, and a silent skip is how coverage rots.
      - run: bash scripts/test-headless.sh all
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          HEADLESS_REQUIRE_ALL: "1"
